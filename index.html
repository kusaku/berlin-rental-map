<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта вариантов аренды</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #1d252c;
      --muted: #68737d;
      --line: #d8dee4;
      --home: #2563eb;
      --school: #7c3aed;
      --good: #15803d;
      --watch: #b45309;
      --bad: #b91c1c;
      --swap: #64748b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      color: var(--ink);
      background: #f6f7f8;
      overflow-x: hidden;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(360px, 430px) 1fr;
      min-height: 100%;
    }

    aside {
      background: white;
      border-right: 1px solid var(--line);
      overflow: auto;
      padding: 22px;
    }

    h1 {
      font-size: 21px;
      line-height: 1.2;
      margin: 0 0 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin: 0 0 18px;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
      margin-bottom: 18px;
      font-size: 13px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      flex: 0 0 auto;
      border: 2px solid white;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .2);
    }

    .home { background: var(--home); }
    .school { background: var(--school); }
    .good { background: var(--good); }
    .watch { background: var(--watch); }
    .bad { background: var(--bad); }
    .swap { background: var(--swap); }

    .section-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      margin: 18px 0 8px;
      text-transform: uppercase;
    }

    .item {
      border: 1px solid var(--line);
      border-left-width: 5px;
      border-radius: 8px;
      margin: 8px 0;
      padding: 10px 11px;
      background: #fff;
    }

    .item.good { border-left-color: var(--good); }
    .item.watch { border-left-color: var(--watch); }
    .item.bad { border-left-color: var(--bad); }
    .item.swap { border-left-color: var(--swap); }

    .item button {
      appearance: none;
      background: transparent;
      border: 0;
      color: inherit;
      cursor: pointer;
      display: block;
      font: inherit;
      padding: 0;
      text-align: left;
      width: 100%;
    }

    .name {
      font-size: 14px;
      font-weight: 750;
      line-height: 1.25;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      margin-top: 4px;
    }

    .verdict {
      font-size: 12px;
      line-height: 1.35;
      margin-top: 7px;
    }

    #map {
      min-height: 100vh;
      width: 100%;
    }

    .marker {
      align-items: center;
      border: 2px solid white;
      border-radius: 999px;
      box-shadow: 0 2px 9px rgba(22, 30, 38, .28);
      color: white;
      display: flex;
      font-size: 12px;
      font-weight: 800;
      height: 30px;
      justify-content: center;
      width: 30px;
    }

    .leaflet-popup-content {
      font-size: 13px;
      line-height: 1.35;
      min-width: 230px;
    }

    .popup-title {
      font-weight: 800;
      margin-bottom: 5px;
    }

    .popup-meta {
      color: #52606d;
      margin-bottom: 7px;
    }

    .popup-link {
      display: inline-block;
      margin-top: 7px;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        max-height: 46vh;
        padding: 16px;
      }

      #map {
        min-height: 54vh;
      }
    }

    @media (max-width: 430px) {
      h1 {
        font-size: 18px;
      }

      .subtitle {
        font-size: 12px;
        margin-bottom: 14px;
      }

      .legend {
        grid-template-columns: 1fr 1fr;
        gap: 7px 9px;
        font-size: 12px;
      }

      .item {
        padding: 9px;
      }

      .name {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

      <p class="subtitle">

      </p>

      <div class="legend">
        <span><i class="dot home"></i>наш дом</span>

        <span><i class="dot good"></i>основной кандидат</span>
        <span><i class="dot watch"></i>компромисс</span>
        <span><i class="dot bad"></i>дорого/далеко</span>
        <span><i class="dot swap"></i>обмен</span>
      </div>

      <div class="section-title">Ориентиры</div>
      <div id="landmarks"></div>

      <div class="section-title">Варианты</div>
      <div id="list"></div>
    </aside>
    <main id="map"></main>
  </div>

    const colorByType = {
      home: "#2563eb",
      school: "#7c3aed",
      good: "#15803d",
      watch: "#b45309",
      bad: "#b91c1c",
      swap: "#64748b"
    };

    const map = L.map("map", {
      zoomControl: true,
      scrollWheelZoom: true
    });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    function distanceKm(a, b) {
      const r = 6371;
      const dLat = (b.lat - a.lat) * Math.PI / 180;
      const dLon = (b.lon - a.lon) * Math.PI / 180;
      const lat1 = a.lat * Math.PI / 180;
      const lat2 = b.lat * Math.PI / 180;
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 2 * r * Math.asin(Math.sqrt(s));
    }

    function makeIcon(type, label) {
      return L.divIcon({
        className: "",
        html: `<div class="marker" style="background:${colorByType[type]}">${label}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -16]
      });
    }

    function popupHtml(point) {
      const robinson = distanceKm(point, schools[0]).toFixed(1);
      const victoria = distanceKm(point, schools[1]).toFixed(1);
      const fromHome = point.type === "home" ? "0.0" : distanceKm(point, home).toFixed(1);
      const facts = [point.rooms, point.area, point.warm].filter(Boolean).join(" · ");
      return `
        <div class="popup-title">${point.name}</div>
        <div class="popup-meta">${point.address}</div>
        ${facts ? `<div>${facts}</div>` : ""}
        ${point.source ? `<div class="popup-meta">Источник: ${point.source}</div>` : ""}
        ${point.note ? `<div>${point.note}</div>` : ""}
        ${point.verdict ? `<div>${point.verdict}</div>` : ""}
        <div class="popup-meta">От дома: ${fromHome} км · Robinson: ${robinson} км · Victoriastadt: ${victoria} км</div>
        ${point.url ? `<a class="popup-link" href="${point.url}" target="_blank" rel="noreferrer">Открыть объявление</a>` : ""}
      `;
    }

    const bounds = L.latLngBounds([]);

    function addMarker(point, typeOverride) {
      const type = typeOverride || point.status || point.type;
      const marker = L.marker([point.lat, point.lon], {
        icon: makeIcon(type, point.label)
      }).addTo(map);
      marker.bindPopup(popupHtml(point));
      bounds.extend([point.lat, point.lon]);
      return marker;
    }

    const landmarkMarkers = new Map();
    landmarkMarkers.set("home", addMarker(home));
    schools.forEach((school) => {
      landmarkMarkers.set(school.label, addMarker(school));
    });

    const listingMarkers = new Map();
    listings.forEach((listing) => {
      listingMarkers.set(listing.label, addMarker(listing));
    });

    L.polyline([
      [home.lat, home.lon],
      [schools[0].lat, schools[0].lon],
      [schools[1].lat, schools[1].lon]
    ], {
      color: "#334155",
      dashArray: "7 8",
      weight: 2,
      opacity: .6
    }).addTo(map);

    map.fitBounds(bounds.pad(0.18));

    function renderLandmarks() {
      const box = document.getElementById("landmarks");
      const points = [home, ...schools];
      box.innerHTML = points.map((point) => {
        const key = point.type === "home" ? "home" : point.label;
        return `
        <div class="item ${point.type === "home" ? "good" : "watch"}">
          <button type="button" data-landmark="${key}">
            <div class="name">${point.name}</div>
            <div class="meta">${point.address}</div>
            ${point.note ? `<div class="verdict">${point.note}</div>` : ""}
          </button>
        </div>
      `;
      }).join("");

      box.querySelectorAll("button[data-landmark]").forEach((button) => {
        button.addEventListener("click", () => {
          const marker = landmarkMarkers.get(button.dataset.landmark);
          if (marker) {
            map.setView(marker.getLatLng(), 16);
            marker.openPopup();
          }
        });
      });
    }

    function renderListings() {
      const box = document.getElementById("list");
      box.innerHTML = listings.map((listing) => {
        const robinson = distanceKm(listing, schools[0]).toFixed(1);
        const victoria = distanceKm(listing, schools[1]).toFixed(1);
        const fromHome = distanceKm(listing, home).toFixed(1);
        return `
          <div class="item ${listing.status}">
            <button type="button" data-label="${listing.label}">
              <div class="name">${listing.label}. ${listing.name}</div>
              <div class="meta">${listing.rooms} · ${listing.area} · ${listing.warm}</div>
              ${listing.source ? `<div class="meta">Источник: ${listing.source}</div>` : ""}
              <div class="meta">Дом ${fromHome} км · Robinson ${robinson} км · Victoriastadt ${victoria} км</div>
              <div class="verdict">${listing.verdict}</div>
            </button>
          </div>
        `;
      }).join("");

      box.querySelectorAll("button[data-label]").forEach((button) => {
        button.addEventListener("click", () => {
          const marker = listingMarkers.get(button.dataset.label);
          if (marker) {
            map.setView(marker.getLatLng(), 16);
            marker.openPopup();
          }
        });
      });
    }

    renderLandmarks();
    renderListings();
  </script>
</body>
</html>
